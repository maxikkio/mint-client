name: Build All Platforms

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-desktop:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            output_name: mint-client-windows.exe
          - os: ubuntu-latest
            output_name: mint-client-linux

    steps:
    - name: Pobierz kod źródłowy
      uses: actions/checkout@v4

    - name: Konfiguracja Pythona
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalacja zależności
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller requests

    - name: Kompilacja przez PyInstaller
      run: |
        pyinstaller --noconsole --onefile main.py -n ${{ matrix.output_name }}

    - name: Wrzuć plik do GitHub Releases
      uses: softprops/action-gh-release@v2
      with:
        files: dist/${{ matrix.output_name }}

  build-android:
    name: Build for Android (APK)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Buildozer dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf automake libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev libltdl-dev

    - name: Install Buildozer and Cython
      run: |
        pip install --upgrade pip
        pip install Cython buildozer

    - name: Create Buildozer spec
      run: |
        cat << 'EOF' > buildozer.spec
        [app]
        title = Mint Client
        package.name = mintclient
        package.domain = org.mint
        source.dir = .
        source.file = main
        source.include_exts = py,png,jpg,kv,atlas
        version = 1.0.1
        requirements = python3,kivy,requests
        orientation = portrait
        fullscreen = 0
        android.permissions = INTERNET
        android.ndk = 25b
        EOF

    - name: Build with Buildozer
      run: |
        yes | buildozer -v android debug

    - name: Upload APK to Release
      uses: softprops/action-gh-release@v1
      with:
        files: bin/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
